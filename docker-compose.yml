services:

  db:
    image: postgres:12
    command: postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS}'
    shm_size: '2g'
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    ports:
      - '5432:5432'

  redis:
     image: redis:7
     command: ["redis-server", "--save", "", "--appendonly", "no"]
     volumes:
       - redis_data:/data
     ports:
       - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python main.py
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    tty: true
    links:
      - 'db'
      - 'redis'
    depends_on:
      - db
      - redis
    ports:
      - '5001:8000'

  # Celery beat scheduler
  celery-beat:
    build: .
    command: celery -A tasks.celery beat --loglevel=info
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # Critical queue worker (webhooks)
  worker-critical:
    build: .
    environment:
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
    command: celery -A tasks.celery worker -Q critical --pool=custom --concurrency=100 --loglevel=info --hostname=worker-critical
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # Normal queue worker (periodic tasks)
  worker-normal:
    build: .
    environment:
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
    command: celery -A tasks.celery worker -Q normal --pool=custom --concurrency=30 --loglevel=info --hostname=worker-normal
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # Background queue worker (coordination)
  worker-background:
    build: .
    environment:
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
    command: celery -A tasks.celery worker -Q background --pool=custom --concurrency=20 --loglevel=info --hostname=worker-background
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # Phone check queue worker (webhook batch submission)
  worker-phone-check:
    build: .
    environment:
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
    command: celery -A tasks.celery worker -Q phone_check --pool=custom --concurrency=50 --loglevel=info --hostname=worker-phone-check
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # Link processing queue worker
  worker-link-processing:
    build: .
    environment:
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
    command: celery -A tasks.celery worker -Q link_processing --pool=custom --concurrency=50 --loglevel=info --hostname=worker-link-processing
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # AI rewrite queue worker
  worker-ai-rewrite:
    build: .
    environment:
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
    command: celery -A tasks.celery worker -Q ai_rewrite --pool=custom --concurrency=10 --loglevel=info --hostname=worker-ai-rewrite
    volumes:
      - ./src/:/app/
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  # flower:
  #   image: mher/flower
  #   restart: always
  #   env_file:
  #     - ./.env
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/0
  #     - FLOWER_PORT=5555
  #     - FLOWER_PERSISTENT=True
  #     - FLOWER_STATE_SAVE_INTERVAL=10000
  #     - FLOWER_DB=/data/flower.db
  #   volumes:
  #     - flower_data:/data/
  #   depends_on:
  #     - redis
  #     - api
  #     - worker
  #   ports:
  #     - '5555:5555'

  web:
    image: nginx
    ports:
      - '5000:8888'
    volumes:
      - ./html/:/usr/share/nginx/html/
      - ./services/nginx.conf:/etc/nginx/conf.d/nginx.conf
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: